<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="BASE lab mark">
  <title>BASE mark</title>
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E88C8"/>
      <stop offset="1" stop-color="#2BA84A"/>
