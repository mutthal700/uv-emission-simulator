  </defs>
  <!-- Building: gabled outline, open at the right wall so air can flow out -->
  <path d="M84 104 H20 V52 L60 18 L100 52 V70" fill="none" stroke="#0B3C5D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
