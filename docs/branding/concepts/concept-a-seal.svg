<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="BASE — Building Air-conditioning and Sustainable Environment Research Laboratory">
  <title>BASE seal</title>
  <defs>
    <path id="top" d="M52 200 A148 148 0 0 1 348 200"/>
    <path id="bot" d="M40 200 A160 160 0 0 0 360 200"/>
    <linearGradient id="airA" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#7BD389"/></linearGradient>
    <clipPath id="inner"><circle cx="200" cy="200" r="118"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="194" fill="#0B3C5D"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
  <circle cx="200" cy="200" r="124" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
  <text font-family="Montserrat, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.9" fill="#FFFFFF">
    <textPath href="#top" startOffset="50%" text-anchor="middle">BUILDING AIR-CONDITIONING AND SUSTAINABLE ENVIRONMENT</textPath>
  </text>
  <text font-family="Montserrat, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#FFFFFF">
    <textPath href="#bot" startOffset="50%" text-anchor="middle">RESEARCH LABORATORY</textPath>
  </text>
  <path d="M30 200 c6 -10 16 -12 22 -8 c-4 8 -14 12 -22 8z" fill="#7BD389"/>
  <path d="M370 200 c-6 -10 -16 -12 -22 -8 c4 8 14 12 22 8z" fill="#7BD389"/>
  <g clip-path="url(#inner)">
    <rect x="80" y="80" width="240" height="240" fill="#F3F8FB"/>
    <!-- airflow swirls in the sky -->
    <path d="M110 128 C140 110 160 142 190 126 S240 110 262 124" fill="none" stroke="url(#airA)" stroke-width="7" stroke-linecap="round"/>
    <path d="M128 150 C150 138 168 160 190 150 S226 138 244 150 C256 158 272 156 280 146" fill="none" stroke="url(#airA)" stroke-width="7" stroke-linecap="round"/>
    <!-- skyline -->
    <path d="M86 320 V246 H122 V214 H158 V320 Z" fill="#1E88C8"/>
    <path d="M164 320 V180 L200 164 L236 180 V320 Z" fill="#0B3C5D"/>
    <path d="M242 320 V226 H286 V250 H314 V320 Z" fill="#2BA84A"/>
    <g fill="#F3F8FB">
      <rect x="178" y="196" width="12" height="12"/><rect x="210" y="196" width="12" height="12"/>
      <rect x="178" y="220" width="12" height="12"/><rect x="210" y="220" width="12" height="12"/>
      <rect x="178" y="244" width="12" height="12"/><rect x="210" y="244" width="12" height="12"/>
      <rect x="130" y="228" width="10" height="10"/><rect x="130" y="250" width="10" height="10"/>
      <rect x="256" y="240" width="10" height="10"/><rect x="256" y="262" width="10" height="10"/>
    </g>
  </g>
  <rect x="140" y="268" width="120" height="40" rx="6" fill="#FFFFFF"/>
  <text x="203" y="298" text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#0B3C5D">BASE</text>
